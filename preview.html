<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Preview | Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131215;
    --card: #1c1a20;
    --gold: #d4a548;
    --text: #f0e6d8;
    --text-muted: #999086;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 10%, #2a1f18 0%, #121013 75%);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Marcellus', serif;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: #fce8c5;
    margin-bottom: 6px;
  }
  p.sub {
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(212, 165, 72, 0.25);
    backdrop-filter: blur(10px);
  }
  .btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  .btn.primary {
    background: linear-gradient(135deg, #d4a548, #9e6b20);
    color: #120e06;
    font-weight: 600;
  }
  .btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(212, 165, 72, 0.35);
  }
  .preview-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Mobile Phone Mockup */
  .phone-frame {
    position: relative;
    width: 360px;
    height: 760px;
    background: #0d0d10;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.12),
                inset 0 0 0 2px rgba(255, 255, 255, 0.05);
  }
  /* Dynamic Island / Notch */
  .phone-island {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 26px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 9px;
  }
  .phone-camera {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a2233 30%, #080c14 70%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 40px;
    background: #fdf6ec;
  }
  .screen iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #4a2a14;
  }
  .footer-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Radha &amp; Vikash</h1>
  <p class="sub">Live Invitation Simulator &middot; Mandir Sunrise</p>
</header>

<div class="toolbar">
  <button class="btn" onclick="reloadFrame()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    Restart Door
  </button>
  <button class="btn" onclick="skipDoor()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    Skip Gate
  </button>
  <a class="btn primary" href="index.html" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    Open Fullscreen
  </a>
</div>

<div class="preview-wrapper">
  <div class="phone-frame">
    <div class="phone-island">
      <div class="phone-camera"></div>
    </div>
    <div class="screen">
      <iframe id="inviteFrame" src="index.html" title="Live Preview"></iframe>
    </div>
  </div>
  <p class="footer-note">Tap the gold coin or &ldquo;Tap to open&rdquo; to unlock the invitation experience</p>
</div>

<script>
  function reloadFrame() {
    const f = document.getElementById('inviteFrame');
    f.src = 'index.html?t=' + Date.now();
  }
  function skipDoor() {
    const f = document.getElementById('inviteFrame');
    f.src = 'index.html#open';
  }
</script>

</body>
</html>
